# Runs the tests on every push to main and, when package.json has a version npm
# doesn't have yet, publishes it. So `npm version` and a push is a release.
#
# There is no token: npm trusts this file by name (Trusted Publisher in the
# package's settings on npmjs.com). Renaming it means changing the name there.
name: Test and publish

on:
  push:
    branches: [main]

# A later push waits for this one, so two runs can't publish the same version.
concurrency: publish

permissions:
  contents: read
  id-token: write # how npm knows this run comes from this repository and file

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24' # trusted publishing needs npm 11.5.1 or later
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm test
      - name: Publish if npm doesn't have this version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "htmlboard@$version" version > /dev/null 2>&1; then
            echo "htmlboard@$version is already on npm: nothing to publish."
          else
            npm publish
          fi
